<div class="container mt-4">
  <div class="card shadow p-4">
    <h3 class="mb-4 text-primary">Cadastro de Cliente - Loja Virtual</h3>
    
    <form>
      <div class="mb-3">
        <label for="txtNome" class="form-label">Nome Completo</label>
        <input type="text" class="form-control" id="txtNome" placeholder="Digite seu nome completo">
      </div>

      <div class="mb-3">
        <label for="txtEmail" class="form-label">E-mail</label>
        <input type="email" class="form-control" id="txtEmail" placeholder="seu@email.com">
      </div>

      <div class="mb-3">
        <label for="txtCpf" class="form-label">CPF</label>
        <input type="text" class="form-control" id="txtCpf" placeholder="000.000.000-00">
      </div>

      <div class="mb-3">
        <label for="txtTelefone" class="form-label">Telefone / WhatsApp</label>
        <input type="text" class="form-control" id="txtTelefone" placeholder="(00) 00000-0000">
      </div>

      <button type="submit" class="btn btn-success w-100">Cadastrar Cliente</button>
    </form>
  </div>
</div>
